<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulador OSP · Miami-Dade</title>
<style>
body { margin: 0; }
.md-simulator{min-height:100vh;min-height:100dvh;background:#f3f7fa;color:#0b2545;font:16px/1.5 system-ui,sans-serif}
.md-simulator *{box-sizing:border-box}
.md-simulator button{font:inherit;cursor:pointer}
.md-simulator button:disabled{opacity:.55;cursor:default}
.md-simulator button:focus-visible,.md-simulator input:focus-visible{outline:3px solid #087da6;outline-offset:3px}
.md-header{display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,52px);background:white;border-bottom:1px solid #d5e3ee;font-weight:700}
.md-header img{width:118px;max-height:38px;object-fit:contain}
.md-progress{margin-left:auto;font-size:.87rem;color:#315169;text-align:right}
.md-content{max-width:1440px;margin:auto;padding:clamp(18px,4vw,52px)}
.md-content h1{font-size:clamp(1.55rem,3vw,2.6rem);line-height:1.14;margin:0 0 12px}
.md-content p{margin:0 0 16px}
.md-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:20px;align-items:start}
.md-viewer{position:relative;overflow:hidden;isolation:isolate;border-radius:16px;margin:0;background:#dbe8ee}
.md-viewer>img{width:100%;height:auto;display:block}
.md-viewer figcaption{position:absolute;left:10px;bottom:10px;padding:4px 8px;border-radius:6px;color:white;background:#0b2545;font-size:.75rem}
.md-panel{background:white;border:1px solid #d5e3ee;border-radius:16px;padding:20px}
.md-stops{display:grid;gap:10px}
.md-stop-link{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px;border:1px solid #d5e3ee;border-radius:9px;background:#f5f9fc;color:#0b2545;font-weight:700!important}
.md-status{font-size:.75rem;color:#315169}
.md-pin{position:absolute;display:grid;place-content:center;width:44px;height:44px;border:2px solid white;border-radius:50%;background:#0b2545;color:white;box-shadow:0 2px 8px #0008;font-weight:800!important;transform:translate(-50%,-100%)}
.md-pin-0{left:44%;top:85%}.md-pin-1{left:71%;top:80%}.md-pin-2{left:57%;top:52%}.md-pin-3{left:38%;top:43%}
.md-primary,.md-secondary,.md-back{min-height:44px;padding:9px 14px;border:1px solid #0b2545;border-radius:9px;font-weight:700!important}
.md-primary{background:#0b2545;color:white}.md-secondary,.md-back{background:white;color:#0b2545}
.md-back,.md-transition{margin-bottom:14px}
.md-panel fieldset{padding:0;border:0;margin:0 0 14px;min-width:0}
.md-panel legend{margin:0 0 8px;font-weight:750}
.md-choice{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;padding:9px 10px;background:#eef5fa;border-radius:8px;cursor:pointer}
.md-choice input{margin-top:.35em;accent-color:#0072a3}
.md-feedback{border-left:4px solid #0072a3;background:#e9f4fa;padding:10px 12px;margin:12px 0;border-radius:4px}
.md-feedback p,.md-results p{margin:3px 0}
.md-results{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.md-results li{background:white;border:1px solid #d5e3ee;border-radius:12px;padding:14px}
.md-actions{display:flex;gap:8px;flex-wrap:wrap}
.md-transition img{animation:md-descend 850ms ease-in-out both}
.md-target-0 img{transform-origin:44% 85%}.md-target-1 img{transform-origin:71% 80%}
.md-target-2 img{transform-origin:57% 52%}.md-target-3 img{transform-origin:38% 43%}
@keyframes md-descend{to{transform:scale(2.2)}}
@media(max-width:820px){.md-grid,.md-results{grid-template-columns:1fr}}
@media(max-width:485px){.md-header{gap:10px;flex-wrap:wrap}.md-header img{width:90px}.md-progress{margin-left:0;width:100%;text-align:left}.md-pin{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.md-transition img{animation:none}}
.md-street-head{display:flex;justify-content:space-between;align-items:start;gap:12px;flex-wrap:wrap}
.md-street-layout{display:grid;gap:12px}
.md-street-camera{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;background:#15334b;aspect-ratio:16/8;container-type:size;touch-action:none;cursor:grab;user-select:none}
.md-street-camera:active{cursor:grabbing}
.md-street-camera:focus-visible{outline:3px solid #087da6;outline-offset:3px}
.md-street-world{position:absolute;left:50%;top:50%;width:max(128cqw,215cqh);aspect-ratio:16/9;transform:translate(calc(-50% + var(--look-x,0px)),calc(-50% + var(--look-y,0px)))}
.md-street-world>img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.md-street-arrow{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);display:grid;place-items:center;min-width:54px;height:48px;border:2px solid white;border-radius:100px;background:#0b2545;color:white;box-shadow:0 4px 18px #0008;font-size:1.45rem!important}
.md-street-camera[data-point="1"] .md-pin-3{left:79%;top:84%}
.md-street-arrow:hover{background:#0072a3}
.md-street-caption{position:absolute;left:12px;bottom:10px;background:#0b2545;color:white;border-radius:6px;padding:3px 8px;font-size:.75rem;pointer-events:none}
.md-street-bar,.md-street-activities{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.md-street-index{font-size:.9rem;font-weight:700;margin-inline:4px}
.md-street-activities button{min-height:44px}
.md-street-camera+div button{min-height:44px}
@media(max-width:600px){.md-street-camera{aspect-ratio:4/3}.md-street-arrow{bottom:15%}}
.md-utility-pin{position:absolute;display:grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border:2px solid #fff;border-radius:24px;background:var(--utility-color);color:#fff;box-shadow:0 2px 12px #0009;transform:translate(-50%,-100%);font-size:.68rem!important;font-weight:850!important;white-space:nowrap}
.md-utility-pin::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:7px;background:white;transform:translateX(-50%)}
.md-utility-pin:hover{filter:brightness(1.14)}
.md-utility-pin:focus-visible{outline-color:#fff!important}
.md-utility-links{display:flex;align-items:center;flex-wrap:wrap;gap:8px}
.md-utility-link{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:7px 10px;border:1px solid #d5e3ee;border-radius:8px;background:#fff;color:#0b2545;text-align:left;font-size:.85rem!important}
.md-utility-link::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--utility-color);flex:none}
.md-simulator .md-utility-dialog{width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);padding:clamp(16px,4vw,28px);overflow:auto;border:1px solid #d5e3ee;border-radius:14px;background:#fff;color:#0b2545;box-shadow:0 20px 70px #001f3b55}
.md-utility-dialog::backdrop{background:#081c33a6}
.md-utility-dialog h2{margin:10px 0 4px;line-height:1.15}
.md-utility-dialog p{margin:8px 0}
.md-utility-dialog dl{margin:14px 0}
.md-utility-dialog dt{font-weight:800;margin-top:10px}
.md-utility-dialog dd{margin:2px 0}
.md-utility-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.md-utility-badge{padding:3px 8px;border-radius:6px;background:var(--utility-color);color:#fff;font-size:.8rem;font-weight:800}
.md-utility-close{min-width:44px;min-height:44px;border:1px solid #aac0d2;border-radius:8px;background:#fff;color:#0b2545;font-size:1.4rem!important}
.md-street-camera[data-point="2"] .md-street-arrow{left:67%;bottom:38%}
@media(max-width:600px){.md-street-world{width:max(128cqw,185cqh)}}
.md-pano-layer{position:absolute;inset:0;z-index:1}
.md-pano-layer canvas{display:block;width:100%;height:100%}
.md-pano-layer[hidden],.md-utility-pin[hidden]{display:none}
.md-street-arrow,.md-street-caption{z-index:2}
.md-street-world[hidden]{display:none}
</style>
<script src="./panorama.js" defer></script>
</head>
<body>
<main id="recorrido" class="md-simulator">
  <header class="md-header">
    <img alt="Fiberlog">
    <span>Inspección visual OSP</span>
    <span class="md-progress" role="status"></span>
  </header>
  <section class="md-content"></section>
  <dialog class="md-utility-dialog" aria-labelledby="md-utility-title"></dialog>
  <noscript>Activa JavaScript en el navegador para abrir el recorrido.</noscript>
</main>

<!-- Imágenes incorporadas. El archivo funciona también sin conexión. -->










<script>
"use strict";
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const response = await fetch("./datos/escenas.html");
    if (!response.ok) throw new Error("Escenas no disponibles");
    const source = new DOMParser().parseFromString(await response.text(), "text/html");
    for (const id of ["foto-1", "foto-2", "foto-3", "foto-4", "foto-5", "foto-6", "vista-media", "vista-cruce", "vista-lateral"]) {
      const data = source.getElementById(id)?.textContent.trim();
      if (!/^data:image\/(png|webp);base64,/.test(data ?? "")) throw new Error("Imagen ausente");
      const item = document.createElement("script");
      item.type = "text/plain";
      item.id = id;
      item.textContent = data;
      document.body.append(item);
    }
    startSimulator();
  } catch (error) {
    document.querySelector(".md-content").textContent = "No se pudieron cargar las escenas. Recarga la página para volver a intentarlo.";
    console.error(error);
  }
});
function startSimulator() {

// Edita las preguntas, opciones y explicaciones en este bloque.
const brand = document.getElementById("foto-1").textContent.trim();
const street = document.getElementById("foto-2").textContent.trim();

const stops = [
  {
    id: "DR-01", title: "Drenaje pluvial", photo: document.getElementById("foto-3").textContent.trim(),
    alt: "Rejilla de drenaje pluvial al ras de la cuneta, junto al bordillo.",
    observation: "La rejilla junto al bordillo indica una entrada de drenaje visible.",
    question: "¿Qué información permite evaluar un cruce subterráneo junto a esta entrada?",
    choices: ["La posición aproximada de la rejilla.", "El trazado, las dimensiones y las cotas de invert de la conducción.", "El ancho visible del pavimento."],
    correct: 1, feedback: "Solicita el trazado, las dimensiones y las cotas de invert pertinentes al cruce. Con esos datos podrás revisar la separación.",
    action: "Solicitar planos de drenaje y verificar el cruce.",
  },
  {
    id: "HH-01", title: "Posible handhole", photo: document.getElementById("foto-4").textContent.trim(),
    alt: "Tapa rectangular de registro cerrada, al ras de la franja verde.",
    observation: "Se observa una tapa rectangular sin identificación legible.",
    question: "¿Cómo registrarías esta estructura en el inventario preliminar?",
    choices: ["Registro de telecomunicaciones con capacidad disponible.", "Punto autorizado para conexión OSP.", "Posible handhole, con servicio, ID y titular por confirmar."],
    correct: 2, feedback: "Registra la tapa como posible handhole. Confirma el ID, el titular, el servicio y las conexiones con documentación del operador.",
    action: "Consultar el inventario y los planos del operador.",
  },
  {
    id: "TR-01", title: "Árbol", photo: document.getElementById("foto-5").textContent.trim(),
    alt: "Árbol con tronco y copa visibles en la franja entre la acera y la calzada.",
    observation: "El tronco está en la franja verde contigua a la acera.",
    question: "¿Qué debes verificar antes de ubicar una excavación junto al árbol?",
    choices: ["La zona de protección del árbol y los requisitos aplicables.", "Solo el diámetro visible del tronco.", "La distancia hasta la sombra de la copa."],
    correct: 0, feedback: "Verifica la zona de protección y los requisitos aplicables antes de definir la huella de excavación.",
    action: "Confirmar la zona de protección y revisar la huella de trabajo.",
  },
  {
    id: "LT-01", title: "Poste de iluminación", photo: document.getElementById("foto-6").textContent.trim(),
    alt: "Poste vial con base visible, brazo curvo y luminaria.",
    observation: "Se observan la base del poste, el brazo y la luminaria.",
    question: "¿Qué evidencia necesitas para considerar este poste como apoyo OSP?",
    choices: ["Una fotografía de la luminaria.", "La identificación, el titular, los requisitos técnicos y la autorización de uso.", "La cercanía del poste a la ruta preliminar."],
    correct: 1, feedback: "Identifica el activo y confirma el titular. Solicita los requisitos técnicos y la autorización antes de considerarlo como apoyo OSP.",
    action: "Consultar al titular y solicitar los requisitos de uso.",
  },
];
  // Clasificaciones del ejercicio. Las fichas describen la escena y la evidencia por verificar.
  const utilities = {
    drain: {
      title: "Sumidero pluvial", service: "Drenaje pluvial", mark: "PLUV", color: "#315169", exercise: 0,
      visible: "Rejilla junto al bordillo que recoge escorrentía de la calle.",
      evidence: "Consulta el inventario de drenaje para confirmar la conexión, el trazado y las cotas.",
    },
    cover: {
      title: "Tapa de registro", service: "Servicio por confirmar", mark: "REG", color: "#475569", exercise: 1,
      visible: "Tapa rectangular de un posible handhole. La marca de la tapa no se distingue.",
      evidence: "Compara la identificación del registro con los planos o con el inventario del operador.",
    },
    light: {
      title: "Poste de alumbrado", service: "Power · Alumbrado vial", mark: "PWR", color: "#865200", exercise: 3,
      visible: "Poste con brazo y luminaria para iluminar la calle.",
      evidence: "El alumbrado forma parte de la red eléctrica de este ejercicio. Verifica la placa, el titular y la autorización antes de considerar un uso OSP.",
    },
    hydrant: {
      title: "Hidrante", service: "Agua potable", mark: "AGUA", color: "#075985",
      visible: "Hidrante de superficie en la franja verde, a la izquierda de la calle.",
      evidence: "El inventario del ejercicio lo vincula a la red de agua potable. Para un levantamiento real, solicita el identificador y el plano de la red.",
    },
    sewer: {
      title: "Pozo de inspección sanitario", service: "Aguas servidas · Alcantarillado sanitario", mark: "SAN", color: "#6b3b79",
      visible: "Tapa circular al ras de la calzada que da acceso al pozo de inspección.",
      evidence: "En este ejercicio, el inventario identifica la tapa como sanitaria. En campo, comprueba el identificador y la red en la documentación del operador.",
    },
    transformer: {
      title: "Transformador en pedestal", service: "Power · Energía eléctrica", mark: "PWR", color: "#865200",
      visible: "Gabinete verde sobre una base junto a la acera. Aloja un transformador de distribución en esta escena.",
      evidence: "Verifica el número de activo y el titular en el inventario eléctrico.",
    },
    telecom: {
      title: "Pedestal de telecomunicaciones", service: "Telecom · Telecomunicaciones", mark: "TEL", color: "#146052",
      visible: "Pedestal vertical junto a la acera para conexiones de una red de telecomunicaciones.",
      evidence: "El inventario del ejercicio confirma el servicio. En campo, revisa la etiqueta del titular y solicita los planos para confirmar conexiones y ductos.",
    },
  };

  // Posiciones de cámara y marcadores. x e y se expresan en porcentaje de cada imagen.
  const viewpoints = [
    { photo: street, name: "Calle principal", alt: "Inicio de la calle principal junto a la rejilla, la tapa y el poste.",
      assets: [["drain", 44, 86], ["cover", 71, 82], ["light", 38, 43]] },
    { photo: document.getElementById("vista-media").textContent.trim(), name: "Calle principal", alt: "Tramo intermedio de la calle principal, junto al poste de alumbrado.",
      assets: [["light", 79, 83]] },
    { photo: document.getElementById("vista-cruce").textContent.trim(), name: "Intersección", alt: "Intersección con una calle residencial a la derecha.", assets: [] },
    { photo: document.getElementById("vista-lateral").textContent.trim(), name: "Calle lateral", alt: "Calle lateral con un hidrante, una tapa sanitaria, un transformador y un pedestal de telecomunicaciones.",
      assets: [["hydrant", 19.3, 51.7], ["sewer", 47.8, 73.5], ["transformer", 70.8, 45.4], ["telecom", 80.5, 56.1]] },
  ];
  const panoramas = ["principal", "tramo", "interseccion", "lateral"];
  const panoramaAssets = [
    [["drain", 73, 77], ["cover", 80.5, 72], ["light", 58.6, 45]],
    [["light", 73.7, 64.3]],
    [],
    [["hydrant", 26.8, 74.2], ["sewer", 49.1, 76.7], ["transformer", 66.7, 64.4], ["telecom", 74.5, 74.2]],
  ];
  let panorama;
  const state = {
    view: "overview", active: 0, selected: null, answers: {},
    viewpoint: 0, lookX: 0, lookY: 0, backTo: "overview",
  };
  let drag = null;
  const root = document.querySelector("#recorrido");
  const utilityDialog = root.querySelector(".md-utility-dialog");
  let transitionTimer;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  }

  function image(src, alt, caption, extra = "") {
    return `<figure class="md-viewer"><img src="${src}" alt="${escapeHtml(alt)}">
      <figcaption>${escapeHtml(caption)}</figcaption>${extra}</figure>`;
  }

  function overview() {
    const pins = stops.map((stop, index) =>
      `<button type="button" class="md-pin md-pin-${index}" data-open="${index}"
        aria-label="${escapeHtml("Abrir " + stop.id + " · " + stop.title)}">${index + 1}</button>`).join("");
    const menu = stops.map((stop, index) => `
      <button type="button" class="md-stop-link" data-open="${index}">
        <span>${escapeHtml(stop.id + " · " + stop.title)}</span>
        <span class="md-status">${stop.id in state.answers ? "Respondida" : "Explorar"}</span>
      </button>`).join("");
    return `<h1 tabindex="-1">Ruta residencial · Miami-Dade</h1>
      <p>Selecciona una parada para observar el elemento y decidir qué información debes verificar.</p>
      <div class="md-grid">
        ${image(street, "Calle residencial con drenaje, tapa de registro, árbol y poste de iluminación.", "Vista general · recreación didáctica", pins)}
        <div class="md-panel md-stops">
          <button type="button" class="md-primary" data-view="street">Entrar a la vista de calle</button>
          ${menu}
          <button type="button" class="md-primary" data-view="summary" ${Object.keys(state.answers).length === stops.length ? "" : "disabled"}>Ver resumen</button>
        </div>
      </div>`;
  }

  function streetView() {
    const current = viewpoints[state.viewpoint];
    const first = state.viewpoint === 0;
    const last = state.viewpoint === viewpoints.length - 1;
    const turning = state.viewpoint === viewpoints.length - 2;
    const pins = current.assets.map(([id, x, y]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-pin" style="left:${x}%;top:${y}%;--utility-color:${asset.color}"
        data-utility="${id}" aria-label="${escapeHtml("Identificar " + asset.title)}">${asset.mark}</button>`;
    }).join("");
    const panoramaPins = panoramaAssets[state.viewpoint].map(([id, x, y]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-pin" style="--utility-color:${asset.color}"
        data-utility="${id}" data-photo-x="${x}" data-photo-y="${y}"
        aria-label="${escapeHtml("Identificar " + asset.title)}" hidden>${asset.mark}</button>`;
    }).join("");
    const utilityLinks = current.assets.map(([id]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-link" style="--utility-color:${asset.color}"
        data-utility="${id}">${escapeHtml(asset.title)}</button>`;
    }).join("");
    const activities = stops.map((stop, index) => `
      <button class="md-secondary" type="button" data-open="${index}">${escapeHtml(stop.title)}${stop.id in state.answers ? " ✓" : ""}</button>`).join("");
    return `<div class="md-street-head"><h1 tabindex="-1">Vista de calle 360°</h1>
      <button class="md-secondary" type="button" data-view="overview">Vista general</button></div>
      <p id="md-street-guide">Arrastra para girar 360° o mirar arriba y abajo. Usa las flechas de la ruta para avanzar y toca los marcadores para identificar las utilidades.</p>
      <div class="md-street-layout">
        <div class="md-street-camera" data-point="${state.viewpoint}" tabindex="0" role="group" aria-label="Visor de la ruta" aria-describedby="md-street-guide md-street-point">
          <div class="md-street-world"><img draggable="false" src="${current.photo}" alt="${escapeHtml(current.alt)}">${pins}</div>
          <div class="md-pano-layer" hidden>
            <canvas role="img" aria-label="${escapeHtml("Panorama de 360 grados. " + current.alt)}"></canvas>${panoramaPins}
          </div>
          ${last ? "" : `<button class="md-street-arrow" type="button" data-move="1"
            aria-label="${turning ? "Girar a la derecha" : "Avanzar por la calle"}">${turning ? "↱" : "↑"}</button>`}
          <span class="md-street-caption">Recreación didáctica</span>
        </div>
        <div class="md-street-bar">
          <button class="md-secondary" type="button" data-move="-1" ${first ? "disabled" : ""}>← Retroceder</button>
          <span class="md-street-index" id="md-street-point" role="status">Punto ${state.viewpoint + 1} de ${viewpoints.length} · ${escapeHtml(current.name)}</span>
          <button class="md-secondary" type="button" data-move="1" ${last ? "disabled" : ""}>${turning ? "Girar a la derecha ↱" : "Avanzar →"}</button>
          <button class="md-secondary" type="button" data-center>Recentrar vista</button>
        </div>
        ${utilityLinks ? `<div class="md-utility-links" role="group" aria-label="Utilidades visibles">${utilityLinks}</div>` : ""}
        <div class="md-street-activities" aria-label="Paradas de inspección" role="group">${activities}
          ${Object.keys(state.answers).length === stops.length ? '<button class="md-primary" type="button" data-view="summary">Ver resumen</button>' : ""}
        </div>
      </div>`;
  }

  function openUtility(id) {
    const asset = utilities[id];
    utilityDialog.innerHTML = `<div class="md-utility-top">
      <span class="md-utility-badge" style="--utility-color:${asset.color}">${escapeHtml(asset.service)}</span>
      <button type="button" class="md-utility-close" data-close-utility aria-label="Cerrar ficha" autofocus>×</button>
      </div><h2 id="md-utility-title">${escapeHtml(asset.title)}</h2>
      <dl><dt>Qué se observa</dt><dd>${escapeHtml(asset.visible)}</dd>
      <dt>Evidencia</dt><dd>${escapeHtml(asset.evidence)}</dd></dl>
      ${asset.exercise === undefined ? "" : `<button type="button" class="md-primary" data-open="${asset.exercise}">Ir a la pregunta</button>`}`;
    utilityDialog.showModal();
  }

  function setLook(x, y) {
    const camera = root.querySelector(".md-street-camera");
    if (!camera) return;
    if (panorama) {
      state.lookX = x;
      state.lookY = Math.max(-290, Math.min(290, y));
      panorama.update(state.lookX, state.lookY);
      return;
    }
    const world = camera.querySelector(".md-street-world");
    const limitX = Math.max(0, (world.clientWidth - camera.clientWidth) / 2);
    const limitY = Math.max(0, (world.clientHeight - camera.clientHeight) / 2);
    state.lookX = Math.max(-limitX, Math.min(limitX, x));
    state.lookY = Math.max(-limitY, Math.min(limitY, y));
    world.style.setProperty("--look-x", `${state.lookX}px`);
    world.style.setProperty("--look-y", `${state.lookY}px`);
  }

  function moveStreet(direction) {
    const next = state.viewpoint + direction;
    if (next < 0 || next >= viewpoints.length) return;
    state.viewpoint = next;
    state.lookX = 0;
    state.lookY = 0;
    drag = null;
    render(".md-street-camera");
  }

  function descent(stop) {
    return `<h1 tabindex="-1">Acercamiento · ${escapeHtml(stop.title)}</h1>
      <figure class="md-viewer md-transition md-target-${state.active}">
        <img src="${street}" alt="Vista general de la calle antes de abrir el detalle.">
      </figure>
      <button type="button" class="md-secondary" data-view="stop">Saltar animación</button>`;
  }

  function stopView(stop) {
    const answer = state.answers[stop.id];
    const answered = answer !== undefined;
    const choices = stop.choices.map((choice, index) => `
      <label class="md-choice">
        <input type="radio" name="answer" value="${index}" ${(answered ? answer : state.selected) === index ? "checked" : ""}>
        <span>${escapeHtml(choice)}</span>
      </label>`).join("");
    const feedback = answered ? `
      <div class="md-feedback" tabindex="-1">
        <strong>${answer === stop.correct ? "Respuesta correcta" : "Revisa la evidencia necesaria"}</strong>
        <p>${escapeHtml(stop.feedback)}</p>
      </div>
      <button type="button" class="md-primary" data-next>${Object.keys(state.answers).length === stops.length ? "Ver resumen" : "Siguiente parada pendiente"}</button>` : "";
    return `<button type="button" class="md-back" data-view="${state.backTo}">${state.backTo === "street" ? "← Volver a la calle" : "← Vista general"}</button>
      <h1 tabindex="-1">${escapeHtml(stop.id + " · " + stop.title)}</h1>
      <div class="md-grid">
        ${image(stop.photo, stop.alt, "Detalle · recreación didáctica")}
        <div class="md-panel">
          <p>${escapeHtml(stop.observation)}</p>
          <form>
            <fieldset ${answered ? "disabled" : ""}>
              <legend>${escapeHtml(stop.question)}</legend>
              ${choices}
            </fieldset>
            ${answered ? "" : '<button type="submit" class="md-primary" disabled>Comprobar respuesta</button>'}
          </form>
          ${feedback}
        </div>
      </div>`;
  }

  function summary() {
    const score = stops.filter(stop => state.answers[stop.id] === stop.correct).length;
    const results = stops.map(stop => `<li><strong>${escapeHtml(stop.id + " · " + stop.title)}</strong>
      <p>${escapeHtml(stop.observation)}</p><p><b>Siguiente acción.</b> ${escapeHtml(stop.action)}</p></li>`).join("");
    return `<h1 tabindex="-1">Registro de hallazgos</h1>
      <p>Respuestas correctas: ${score} de ${stops.length}.</p>
      <ul class="md-results">${results}</ul>
      <div class="md-actions">
        <button type="button" class="md-secondary" data-view="overview">Volver a la vista general</button>
        <button type="button" class="md-primary" data-restart>Reiniciar recorrido</button>
      </div>`;
  }

  function mountPanorama() {
    const camera = root.querySelector(".md-street-camera");
    const layer = camera.querySelector(".md-pano-layer");
    const world = camera.querySelector(".md-street-world");
    const caption = camera.querySelector(".md-street-caption");
    const onReady = ready => {
      layer.hidden = !ready;
      world.hidden = ready;
      caption.textContent = ready ? "Panorama 360° · Recreación didáctica" : "Vista de respaldo · Recreación didáctica";
      if (!ready) {
        panorama?.dispose();
        panorama = null;
        setLook(0, 0);
      }
    };
    try {
      panorama = window.createStreetPanorama?.(layer.querySelector("canvas"),
        Array.from(layer.querySelectorAll("[data-photo-x]")),
        `./panoramas/${panoramas[state.viewpoint]}.webp`, onReady);
    } catch (error) {
      console.warn("Visor panorámico no disponible", error);
    }
    if (!panorama) onReady(false);
  }

  function render(focusSelector) {
    panorama?.dispose();
    panorama = null;
    const stop = stops[state.active];
    const views = { overview, street: streetView, descent, stop: stopView, summary };
    root.querySelector(".md-content").innerHTML = views[state.view](stop);
    root.querySelector(".md-progress").textContent = `${Object.keys(state.answers).length} de ${stops.length} paradas respondidas`;
    if (state.view === "street") {
      mountPanorama();
      setLook(state.lookX, state.lookY);
    }
    if (focusSelector) root.querySelector(focusSelector)?.focus({ preventScroll: state.view === "street" });
  }

  function navigate(view) {
    clearTimeout(transitionTimer);
    drag = null;
    state.view = view;
    render("h1");
  }

  function openStop(index) {
    if (state.view === "street" || state.view === "overview") state.backTo = state.view;
    state.active = index;
    state.selected = null;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      navigate("stop");
      return;
    }
    navigate("descent");
    transitionTimer = setTimeout(() => navigate("stop"), 850);
  }

  root.querySelector(".md-header img").src = brand;
  root.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button || button.disabled) return;
    if ("open" in button.dataset) {
      if (utilityDialog.open) utilityDialog.close();
      openStop(Number(button.dataset.open));
    } else if ("utility" in button.dataset) {
      openUtility(button.dataset.utility);
    } else if ("closeUtility" in button.dataset) {
      utilityDialog.close();
    } else if ("view" in button.dataset) {
      navigate(button.dataset.view);
    } else if ("move" in button.dataset) {
      moveStreet(Number(button.dataset.move));
    } else if ("center" in button.dataset) {
      setLook(0, 0);
    } else if ("restart" in button.dataset) {
      state.answers = {};
      state.viewpoint = 0;
      state.lookX = 0;
      state.lookY = 0;
      state.selected = null;
      navigate("overview");
    } else if ("next" in button.dataset) {
      for (let offset = 1; offset <= stops.length; offset++) {
        const index = (state.active + offset) % stops.length;
        if (!(stops[index].id in state.answers)) {
          openStop(index);
          return;
        }
      }
      navigate("summary");
    }
  });

  utilityDialog.addEventListener("click", event => {
    if (event.target !== utilityDialog) return;
    const bounds = utilityDialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) utilityDialog.close();
  });

  root.addEventListener("pointerdown", event => {
    const camera = event.target.closest(".md-street-camera");
    if (!camera || event.target.closest("button") || event.button !== 0 || !event.isPrimary) return;
    drag = { id: event.pointerId, x: event.clientX - state.lookX, y: event.clientY - state.lookY };
    camera.setPointerCapture(event.pointerId);
  });

  root.addEventListener("pointermove", event => {
    if (drag?.id !== event.pointerId) return;
    setLook(event.clientX - drag.x, event.clientY - drag.y);
  });

  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    root.addEventListener(type, event => {
      if (drag?.id === event.pointerId) drag = null;
    });
  }

  root.addEventListener("keydown", event => {
    if (!event.target.matches(".md-street-camera")) return;
    const key = event.key;
    if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home"].includes(key)) return;
    event.preventDefault();
    if (key === "ArrowUp") moveStreet(1);
    if (key === "ArrowDown") moveStreet(-1);
    if (key === "ArrowLeft") setLook(state.lookX + 40, state.lookY);
    if (key === "ArrowRight") setLook(state.lookX - 40, state.lookY);
    if (key === "PageUp") setLook(state.lookX, state.lookY + 40);
    if (key === "PageDown") setLook(state.lookX, state.lookY - 40);
    if (key === "Home") setLook(0, 0);
  });

  window.addEventListener("resize", () => {
    if (state.view === "street") setLook(state.lookX, state.lookY);
  });

  root.addEventListener("change", event => {
    if (event.target.name !== "answer") return;
    state.selected = Number(event.target.value);
    root.querySelector('button[type="submit"]').disabled = false;
  });

  root.addEventListener("submit", event => {
    event.preventDefault();
    const stop = stops[state.active];
    if (state.selected === null || stop.id in state.answers) return;
    state.answers[stop.id] = state.selected;
    render(".md-feedback");
  });

  render();
}
</script>
</body>
</html>
