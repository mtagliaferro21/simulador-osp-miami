<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSP Simulator · Miami-Dade</title>
<style>
body { margin: 0; }
.md-simulator{min-height:100vh;min-height:100dvh;background:#f3f7fa;color:#0b2545;font:16px/1.5 system-ui,sans-serif}
.md-simulator *{box-sizing:border-box}
.md-simulator button{font:inherit;cursor:pointer}
.md-simulator button:disabled{opacity:.55;cursor:default}
.md-simulator button:focus-visible,.md-simulator input:focus-visible{outline:3px solid #087da6;outline-offset:3px}
.md-header{display:flex;align-items:center;gap:16px;padding:14px clamp(16px,4vw,52px);background:white;border-bottom:1px solid #d5e3ee;font-weight:700}
.md-header img{width:118px;max-height:38px;object-fit:contain}
.md-progress{margin-left:auto;font-size:.87rem;color:#315169;text-align:right}
.md-content{max-width:1440px;margin:auto;padding:clamp(18px,4vw,52px)}
.md-content h1{font-size:clamp(1.55rem,3vw,2.6rem);line-height:1.14;margin:0 0 12px}
.md-content p{margin:0 0 16px}
.md-grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(310px,1fr);gap:20px;align-items:start}
.md-viewer{position:relative;overflow:hidden;isolation:isolate;border-radius:16px;margin:0;background:#dbe8ee}
.md-viewer>img{width:100%;height:auto;display:block}
.md-viewer figcaption{position:absolute;left:10px;bottom:10px;padding:4px 8px;border-radius:6px;color:white;background:#0b2545;font-size:.75rem}
.md-panel{background:white;border:1px solid #d5e3ee;border-radius:16px;padding:20px}
.md-stops{display:grid;gap:10px}
.md-stop-link{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:12px;border:1px solid #d5e3ee;border-radius:9px;background:#f5f9fc;color:#0b2545;font-weight:700!important}
.md-status{font-size:.75rem;color:#315169}
.md-pin{position:absolute;display:grid;place-content:center;width:44px;height:44px;border:2px solid white;border-radius:50%;background:#0b2545;color:white;box-shadow:0 2px 8px #0008;font-weight:800!important;transform:translate(-50%,-100%)}
.md-pin-0{left:44%;top:85%}.md-pin-1{left:71%;top:80%}.md-pin-2{left:57%;top:52%}.md-pin-3{left:38%;top:43%}
.md-primary,.md-secondary,.md-back{min-height:44px;padding:9px 14px;border:1px solid #0b2545;border-radius:9px;font-weight:700!important}
.md-primary{background:#0b2545;color:white}.md-secondary,.md-back{background:white;color:#0b2545}
.md-back,.md-transition{margin-bottom:14px}
.md-panel fieldset{padding:0;border:0;margin:0 0 14px;min-width:0}
.md-panel legend{margin:0 0 8px;font-weight:750}
.md-choice{display:flex;align-items:flex-start;gap:10px;margin:0 0 8px;padding:9px 10px;background:#eef5fa;border-radius:8px;cursor:pointer}
.md-choice input{margin-top:.35em;accent-color:#0072a3}
.md-feedback{border-left:4px solid #0072a3;background:#e9f4fa;padding:10px 12px;margin:12px 0;border-radius:4px}
.md-feedback p,.md-results p{margin:3px 0}
.md-results{list-style:none;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.md-results li{background:white;border:1px solid #d5e3ee;border-radius:12px;padding:14px}
.md-actions{display:flex;gap:8px;flex-wrap:wrap}
.md-transition img{animation:md-descend 850ms ease-in-out both}
.md-target-0 img{transform-origin:44% 85%}.md-target-1 img{transform-origin:71% 80%}
.md-target-2 img{transform-origin:57% 52%}.md-target-3 img{transform-origin:38% 43%}
@keyframes md-descend{to{transform:scale(2.2)}}
@media(max-width:820px){.md-grid,.md-results{grid-template-columns:1fr}}
@media(max-width:485px){.md-header{gap:10px;flex-wrap:wrap}.md-header img{width:90px}.md-progress{margin-left:0;width:100%;text-align:left}.md-pin{width:34px;height:34px}}
@media(prefers-reduced-motion:reduce){.md-transition img{animation:none}}
.md-simulator[data-view="street"]{display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.md-simulator[data-view="street"] .md-header{flex:none;padding-block:6px}
.md-content[data-view="street"]{width:100%;margin:0 auto;padding:clamp(8px,1.6vh,20px) clamp(12px,3vw,40px);display:flex;flex:1;flex-direction:column}
.md-content[data-view="overview"]>h1,.md-content[data-view="overview"]>p{text-align:center}
.md-street-head{position:relative;display:grid;place-items:center;min-height:38px;text-align:center}
.md-street-head h1{margin:0;font-size:clamp(1.35rem,3vw,2.2rem)}
.md-street-head>button{position:absolute;right:0;top:50%;transform:translateY(-50%);min-height:36px;padding:5px 10px;font-size:.88rem}
.md-content #md-street-guide{margin:4px auto 10px;text-align:center;font-size:.88rem;line-height:1.35}
.md-street-layout{display:flex;flex:1;flex-direction:column;gap:8px}
@media(max-width:540px){.md-street-head{display:flex;gap:6px;flex-direction:column}.md-street-head>button{position:static;transform:none}}

.md-street-camera{position:relative;isolation:isolate;overflow:hidden;border-radius:16px;background:#15334b;flex:1 0 150px;min-height:150px;max-height:680px;container-type:size;touch-action:none;cursor:grab;user-select:none}
.md-street-camera:active{cursor:grabbing}
.md-street-camera:focus-visible{outline:3px solid #087da6;outline-offset:3px}
.md-street-world{position:absolute;left:50%;top:50%;width:max(128cqw,215cqh);aspect-ratio:16/9;transform:translate(calc(-50% + var(--look-x,0px)),calc(-50% + var(--look-y,0px))) scale(var(--look-scale,1))}
.md-street-world>img{display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.md-street-arrow{position:absolute;bottom:13%;left:50%;transform:translateX(-50%);display:grid;place-items:center;min-width:54px;height:48px;border:2px solid white;border-radius:100px;background:#0b2545;color:white;box-shadow:0 4px 18px #0008;font-size:1.45rem!important}
.md-street-camera[data-point="1"] .md-pin-3{left:79%;top:84%}
.md-street-arrow:hover{background:#0072a3}
.md-zoom{position:absolute;z-index:2;top:10px;right:10px;display:flex;align-items:center;gap:4px;padding:3px;border-radius:10px;background:#0b2545;color:#fff;box-shadow:0 2px 10px #0005;cursor:default}
.md-zoom output{min-width:42px;text-align:center;font-variant-numeric:tabular-nums;font-size:.75rem}
.md-zoom button{width:36px;height:36px;border:0;border-radius:7px;background:#fff;color:#0b2545;font-size:1.3rem;line-height:1}
.md-zoom button:disabled{opacity:.55}
.md-street-caption{position:absolute;left:12px;bottom:10px;background:#0b2545;color:white;border-radius:6px;padding:3px 8px;font-size:.75rem;pointer-events:none}
.md-street-bar,.md-street-activities,.md-utility-links{display:flex;justify-content:center;align-items:center;flex-wrap:wrap;gap:6px;text-align:center}
.md-street-bar button,.md-street-activities button,.md-utility-links button{min-height:40px;padding:6px 11px;font-size:.875rem}
@media(max-width:540px){.md-street-index{order:-1;flex-basis:100%}}

.md-street-index{font-size:.9rem;font-weight:700;margin-inline:4px}
@media(max-width:600px){.md-street-arrow{bottom:15%}}
.md-utility-pin{position:absolute;display:grid;place-items:center;min-width:44px;height:44px;padding:0 6px;border:2px solid #fff;border-radius:24px;background:var(--utility-color);color:#fff;box-shadow:0 2px 12px #0009;transform:translate(-50%,-100%);font-size:.68rem!important;font-weight:850!important;white-space:nowrap}
.md-utility-pin::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:7px;background:white;transform:translateX(-50%)}
.md-utility-pin:hover{filter:brightness(1.14)}
.md-utility-pin:focus-visible{outline-color:#fff!important}
.md-utility-link{display:inline-flex;align-items:center;gap:7px;min-height:44px;padding:7px 10px;border:1px solid #d5e3ee;border-radius:8px;background:#fff;color:#0b2545;text-align:left;font-size:.85rem!important}
.md-utility-link::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--utility-color);flex:none}
.md-simulator .md-utility-dialog{width:min(520px,calc(100% - 32px));max-height:calc(100% - 32px);padding:clamp(16px,4vw,28px);overflow:auto;border:1px solid #d5e3ee;border-radius:14px;background:#fff;color:#0b2545;box-shadow:0 20px 70px #001f3b55}
.md-utility-dialog::backdrop{background:#081c33a6}
.md-utility-dialog h2{margin:10px 0 4px;line-height:1.15}
.md-utility-dialog p{margin:8px 0}
.md-utility-dialog dl{margin:14px 0}
.md-utility-dialog dt{font-weight:800;margin-top:10px}
.md-utility-dialog dd{margin:2px 0}
.md-utility-top{display:flex;justify-content:space-between;gap:12px;align-items:center}
.md-utility-badge{padding:3px 8px;border-radius:6px;background:var(--utility-color);color:#fff;font-size:.8rem;font-weight:800}
.md-utility-close{min-width:44px;min-height:44px;border:1px solid #aac0d2;border-radius:8px;background:#fff;color:#0b2545;font-size:1.4rem!important}
.md-street-camera[data-point="2"] .md-street-arrow{left:67%;bottom:38%}
@media(max-width:600px){.md-street-world{width:max(128cqw,185cqh)}}
.md-pano-layer{position:absolute;inset:0;z-index:1}
.md-pano-layer canvas{display:block;width:100%;height:100%}
.md-pano-layer[hidden],.md-utility-pin[hidden]{display:none}
.md-street-arrow,.md-street-caption{z-index:2}
.md-street-world[hidden]{display:none}
.md-stop-name{display:flex;align-items:center;gap:9px}
.md-stop-number{display:grid;place-items:center;flex:none;width:27px;height:27px;border-radius:50%;background:#dce9f5;color:#0b2545}
.md-stops h2{font-size:.92rem;margin:4px 0 0}
.md-stop-link:hover,.md-stop-link:focus-visible{border-color:#087da6;background:#e9f4fa}
.md-pin.is-highlighted{background:#087da6;outline:3px solid white;outline-offset:3px;z-index:1}
.md-street-tools{display:grid;gap:6px;flex:none}
.md-tool-options{display:flex;justify-content:center;gap:4px;flex-wrap:wrap}
.md-tool-options button{min-height:36px;padding:5px 10px;font-size:.875rem}
.md-tool-options [aria-pressed="true"]{background:#0b2545;color:white}
.md-street-tools [hidden]{display:none}
.md-content .md-empty-assets{margin:0;text-align:center;font-size:.875rem;color:#315169}
.md-results dl{display:grid;gap:4px;margin:10px 0 0}
.md-results dt{font-weight:750}
.md-results dd{margin:0 0 7px;color:#315169}
.md-street-camera[data-point="4"] .md-street-world{width:min(100cqw,177.777cqh)}
</style>
<script src="./panorama.js?v=4" defer></script>
</head>
<body>
<main id="recorrido" class="md-simulator">
  <header class="md-header">
    <img alt="Fiberlog">
    <span>OSP Visual Inspection</span>
    <span class="md-progress" role="status"></span>
  </header>
  <section class="md-content"></section>
  <dialog class="md-utility-dialog" aria-labelledby="md-utility-title"></dialog>
  <noscript>Enable JavaScript to open the inspection route.</noscript>
</main>












<script>
"use strict";
window.addEventListener("DOMContentLoaded", async () => {
  try {
    const response = await fetch("./datos/escenas.html");
    if (!response.ok) throw new Error("Scene assets unavailable");
    const source = new DOMParser().parseFromString(await response.text(), "text/html");
    for (const id of ["foto-1", "foto-2", "foto-3", "foto-4", "foto-5", "foto-6", "vista-media", "vista-cruce", "vista-lateral"]) {
      const data = source.getElementById(id)?.textContent.trim();
      if (!/^data:image\/(png|webp);base64,/.test(data ?? "")) throw new Error("Image asset missing");
      const item = document.createElement("script");
      item.type = "text/plain";
      item.id = id;
      item.textContent = data;
      document.body.append(item);
    }
    startSimulator();
  } catch (error) {
    document.querySelector(".md-content").textContent = "The scenes could not be loaded. Reload the page to try again.";
    console.error(error);
  }
});
function startSimulator() {

// Edita las preguntas, opciones y explicaciones en este bloque.
const brand = document.getElementById("foto-1").textContent.trim();
const street = document.getElementById("foto-2").textContent.trim();

const stops = [
  {
    id: "DR-01", title: "Storm Drain Inlet", photo: document.getElementById("foto-3").textContent.trim(),
    alt: "Storm drain grate flush with the gutter next to the curb.",
    observation: "The grate next to the curb identifies a visible stormwater inlet.",
    question: "What information is needed to assess an underground crossing near this inlet?",
    choices: ["The approximate location of the grate.", "The pipe alignment, dimensions, and invert elevations.", "The visible pavement width."],
    correct: 1, feedback: "Request the pipe alignment, dimensions, and invert elevations at the crossing. Use those records to evaluate utility clearance.",
    verification: "Pipe alignment, dimensions, invert elevations, and utility clearance at the crossing.",
    action: "Request stormwater drawings and verify the crossing.",
  },
  {
    id: "HH-01", title: "Potential Handhole", photo: document.getElementById("foto-4").textContent.trim(),
    alt: "Closed rectangular access cover flush with the grass verge.",
    observation: "A rectangular access cover is visible, with no legible identification.",
    question: "How should this structure be recorded in the preliminary asset inventory?",
    choices: ["Telco handhole with available capacity.", "Authorized OSP connection point.", "Potential handhole. Verify the utility type, asset ID, and owner."],
    correct: 2, feedback: "Record it as a potential handhole. Confirm the asset ID, owner, utility type, and connections against the operator’s records.",
    verification: "Utility type, asset ID, owner, and connections.",
    action: "Review the operator’s asset inventory and drawings.",
  },
  {
    id: "TR-01", title: "Tree", photo: document.getElementById("foto-5").textContent.trim(),
    alt: "Tree with visible trunk and canopy in the verge between the sidewalk and roadway.",
    observation: "The tree trunk is in the grass verge next to the sidewalk.",
    question: "What should you verify before laying out an excavation next to the tree?",
    choices: ["The tree protection zone and applicable requirements.", "The visible trunk diameter alone.", "The distance to the edge of the canopy’s shadow."],
    correct: 0, feedback: "Verify the tree protection zone and applicable requirements before defining the excavation footprint.",
    verification: "Tree protection zone and applicable excavation requirements.",
    action: "Confirm the tree protection zone and review the work envelope.",
  },
  {
    id: "LT-01", title: "Streetlight Pole", photo: document.getElementById("foto-6").textContent.trim(),
    alt: "Streetlight pole with a visible base, curved mast arm, and luminaire.",
    observation: "The pole base, mast arm, and luminaire are visible.",
    question: "What evidence is needed before considering this pole for an OSP attachment?",
    choices: ["A photograph of the luminaire.", "The asset ID, owner, technical requirements, and attachment authorization.", "The pole’s proximity to the preliminary route."],
    correct: 1, feedback: "Identify the asset and confirm its owner. Request the technical requirements and authorization before considering it for an OSP attachment.",
    verification: "Asset ID, owner, technical requirements, and attachment authorization.",
    action: "Contact the owner and request the attachment requirements.",
  },
];
  // Utility types and supporting evidence used in the training exercise.
  const utilities = {
    drain: {
      title: "Storm Drain Inlet", service: "Stormwater", mark: "STORM", color: "#315169", exercise: 0,
      visible: "A grate next to the curb collects roadway runoff.",
      evidence: "Check the stormwater asset inventory to confirm the connection, pipe alignment, and elevations.",
    },
    cover: {
      title: "Access Cover", service: "Utility Type Unverified", mark: "UNK", color: "#475569", exercise: 1,
      visible: "Rectangular cover consistent with a handhole. The cover marking is illegible.",
      evidence: "Check the access structure’s identification against the operator’s drawings or asset inventory.",
    },
    light: {
      title: "Streetlight Pole", service: "Power · Street Lighting", mark: "POWER", color: "#865200", exercise: 3,
      visible: "Pole with a mast arm and luminaire for roadway lighting.",
      evidence: "The exercise identifies this pole as a street lighting asset. Verify the asset tag, owner, and attachment authorization before considering it for OSP use.",
    },
    hydrant: {
      title: "Fire Hydrant", service: "Water · Potable Water", mark: "WATER", color: "#075985",
      visible: "Aboveground hydrant in the grass verge on the left side of the street.",
      evidence: "The exercise inventory links this hydrant to the potable water system. For field verification, request the asset ID and water system drawings.",
    },
    sewer: {
      title: "Sanitary Sewer Manhole", service: "Sewer · Sanitary Sewer", mark: "SEWER", color: "#6b3b79",
      visible: "Round manhole cover flush with the roadway.",
      evidence: "The exercise inventory identifies this as a sanitary sewer manhole. In the field, verify its asset ID and system classification against the operator’s records.",
    },
    transformer: {
      title: "Pad-Mounted Transformer", service: "Power · Electric Distribution", mark: "POWER", color: "#865200",
      visible: "Green enclosure on a pad next to the sidewalk. This enclosure houses a distribution transformer in the exercise.",
      evidence: "Verify the asset number and owner in the power utility’s asset inventory.",
    },
    telecom: {
      title: "Telco Pedestal", service: "Telco · Telecommunications", mark: "TELCO", color: "#146052",
      visible: "Aboveground pedestal next to the sidewalk that provides access to telecommunications connections.",
      evidence: "The exercise inventory confirms the utility type. In the field, check the owner’s label and request drawings to verify connections and duct routes.",
    },
  };

  Object.assign(utilities, {
    grate: {
      title: "Curbside Storm Drain Grate", service: "Stormwater", mark: "STORM", color: "#315169",
      visible: "A rectangular grate is set into the gutter along the left curb.",
      evidence: "Check the drainage inventory for the inlet ID and connected pipe. Confirm invert elevations before assessing an underground crossing.",
    },
    roundCover: {
      title: "Water Access Cover", service: "Water · Asset Type Unverified", mark: "WATER", color: "#075985",
      visible: "A round cover in the roadway is marked WATER. The specific asset under the cover requires verification.",
      evidence: "Verify the asset ID, owner, and function in the water utility’s records.",
    },
    distribution: {
      title: "Overhead Distribution Pole", service: "Power · Electric Distribution", mark: "POWER", color: "#865200",
      visible: "A wood pole supports a crossarm, insulators, and overhead conductors.",
      evidence: "Verify the pole ID, owner, and documented attachments. Request applicable clearance and attachment requirements from the owner.",
    },
    telcoCover: {
      title: "Telco Handhole", service: "Telco · Telecommunications", mark: "TELCO", color: "#146052",
      visible: "A rectangular access cover is flush with the grass verge. The exercise inventory identifies it as a Telco handhole.",
      evidence: "Verify the asset ID and owner in the operator’s inventory. Request duct and connection records before evaluating an OSP tie-in.",
    },
  });

  // Camera positions and marker coordinates as percentages of each image.
  const viewpoints = [
    { photo: street, name: "Main Street", alt: "Start of the main street next to the storm drain inlet, access cover, and streetlight pole.",
      assets: [["drain", 44, 86], ["cover", 71, 82], ["light", 38, 43]] },
    { photo: document.getElementById("vista-media").textContent.trim(), name: "Main Street", alt: "Midblock view on the main street next to the streetlight pole.",
      assets: [["light", 79, 83]] },
    { photo: document.getElementById("vista-cruce").textContent.trim(), name: "Intersection", nextIsTurn: true, alt: "Intersection with a residential side street on the right.", assets: [] },
    { photo: document.getElementById("vista-lateral").textContent.trim(), name: "Side Street", alt: "Side street with a fire hydrant, sanitary sewer manhole, transformer, and telco pedestal.",
      assets: [["hydrant", 19.3, 51.7], ["sewer", 47.8, 73.5], ["transformer", 70.8, 45.4], ["telecom", 80.5, 56.1]] },
    { photo: "./panoramas/utility-block-v3-preview.webp", name: "Utility Block", alt: "Residential block with a curbside drain grate, a round roadway cover, a power distribution pole, and a Telco handhole.",
      initialLookX: -38, initialLookY: -22,
      assets: [["grate", 18.33, 82.07], ["roundCover", 44.16, 75.61], ["distribution", 72.11, 25.04], ["telcoCover", 86.96, 77.26]] },
  ];
  const panoramas = ["principal", "tramo", "interseccion", "lateral", "utility-block-hd"];
  const panoramaAssets = [
    [["drain", 73, 77], ["cover", 80.5, 72], ["light", 58.6, 45]],
    [["light", 73.7, 64.3]],
    [],
    [["hydrant", 26.8, 74.2], ["sewer", 49.1, 76.7], ["transformer", 66.7, 64.4], ["telecom", 74.5, 74.2]],
    [["grate", 31.2, 70.4], ["roundCover", 43.9, 80.5], ["distribution", 61.2, 46.5], ["telcoCover", 69.2, 66.8]],
  ];
  let panorama;
  const minZoom = .9;
  const maxZoom = 2.4;
  const state = {
    view: "overview", active: 0, selected: null, answers: {},
    viewpoint: 0, lookX: 0, lookY: 0, zoom: 1, backTo: "overview", streetPanel: "assets",
  };
  let drag = null;
  const root = document.querySelector("#recorrido");
  const utilityDialog = root.querySelector(".md-utility-dialog");
  let transitionTimer;

  function escapeHtml(value) {
    return String(value).replace(/[&<>"']/g, character =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[character]);
  }

  function image(src, alt, caption, extra = "") {
    return `<figure class="md-viewer"><img src="${src}" alt="${escapeHtml(alt)}">
      <figcaption>${escapeHtml(caption)}</figcaption>${extra}</figure>`;
  }

  function summaryButton() {
    return Object.keys(state.answers).length === stops.length
      ? '<button type="button" class="md-primary" data-view="summary">View Inspection Summary</button>'
      : "";
  }

  function overview() {
    const pins = stops.map((stop, index) =>
      `<button type="button" class="md-pin md-pin-${index}" data-open="${index}"
        aria-label="${escapeHtml("Open " + stop.id + " · " + stop.title)}">${index + 1}</button>`).join("");
    const menu = stops.map((stop, index) => `
      <button type="button" class="md-stop-link" data-open="${index}">
        <span class="md-stop-name"><span class="md-stop-number" aria-hidden="true">${index + 1}</span>
          <span>${escapeHtml(stop.id + " · " + stop.title)}</span></span>
        ${stop.id in state.answers ? '<span class="md-status">Completed</span>' : ""}
      </button>`).join("");
    return `<h1 tabindex="-1">Residential Inspection Route · Miami-Dade</h1>
      <p>Explore the street in 360° or select an inspection stop to review the evidence.</p>
      <div class="md-grid">
        ${image(street, "Residential street with a storm drain inlet, access cover, tree, and streetlight pole.", "Route Overview · Training Simulation", pins)}
        <div class="md-panel md-stops">
          <button type="button" class="md-primary" data-view="street">Start 360° Inspection</button>
          <h2>Inspection Stops</h2>
          ${menu}
          ${summaryButton()}
        </div>
      </div>`;
  }

  function streetView() {
    const current = viewpoints[state.viewpoint];
    const first = state.viewpoint === 0;
    const last = state.viewpoint === viewpoints.length - 1;
    const turning = current.nextIsTurn;
    const pins = current.assets.map(([id, x, y]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-pin" style="left:${x}%;top:${y}%;--utility-color:${asset.color}"
        data-utility="${id}" aria-label="${escapeHtml("Identify " + asset.title)}">${asset.mark}</button>`;
    }).join("");
    const panoramaPins = panoramaAssets[state.viewpoint].map(([id, x, y]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-pin" style="--utility-color:${asset.color}"
        data-utility="${id}" data-photo-x="${x}" data-photo-y="${y}"
        aria-label="${escapeHtml("Identify " + asset.title)}" hidden>${asset.mark}</button>`;
    }).join("");
    const utilityLinks = current.assets.map(([id]) => {
      const asset = utilities[id];
      return `<button type="button" class="md-utility-link" style="--utility-color:${asset.color}"
        data-utility="${id}">${escapeHtml(asset.title)}</button>`;
    }).join("");
    const activities = stops.map((stop, index) => `
      <button class="md-secondary" type="button" data-open="${index}">${escapeHtml(stop.title)}${stop.id in state.answers ? " ✓" : ""}</button>`).join("");
    return `<div class="md-street-head"><h1 tabindex="-1">360° Street View</h1>
      <button class="md-secondary" type="button" data-view="overview">Overview</button></div>
      <p id="md-street-guide">Drag to look around. Scroll over the panorama to zoom. Use the route arrows to move and select markers to inspect utilities.</p>
      <div class="md-street-layout">
        <div class="md-street-camera" data-point="${state.viewpoint}" tabindex="0" role="group" aria-label="Route Viewer" aria-describedby="md-street-guide md-street-point">
          <div class="md-street-world"><img draggable="false" src="${current.photo}" alt="${escapeHtml(current.alt)}">${pins}</div>
          <div class="md-pano-layer" hidden>
            <canvas role="img" aria-label="${escapeHtml("360-degree panorama. " + current.alt)}"></canvas>${panoramaPins}
          </div>
          ${last ? "" : `<button class="md-street-arrow" type="button" data-move="1"
            aria-label="${turning ? "Turn Right" : "Advance Along Street"}">${turning ? "↱" : "↑"}</button>`}
          <div class="md-zoom" role="group" aria-label="Panorama Zoom">
            <button type="button" data-zoom-step="-1" aria-label="Zoom Out">−</button>
            <output aria-label="Zoom Level" aria-live="off"></output>
            <button type="button" data-zoom-step="1" aria-label="Zoom In">+</button>
          </div>
          <span class="md-street-caption">Training Simulation</span>
        </div>
        <div class="md-street-bar">
          <button class="md-secondary" type="button" data-move="-1" ${first ? "disabled" : ""}>← Previous</button>
          <span class="md-street-index" id="md-street-point" role="status">Viewpoint ${state.viewpoint + 1} of ${viewpoints.length} · ${escapeHtml(current.name)}</span>
          <button class="md-secondary" type="button" data-move="1" ${last ? "disabled" : ""}>${turning ? "Turn Right ↱" : "Next →"}</button>
          <button class="md-secondary" type="button" data-center>Reset View</button>
        </div>
        <div class="md-street-tools">
          <div class="md-tool-options" role="group" aria-label="Street View tools">
            <button type="button" class="md-secondary" data-street-panel="assets" aria-controls="md-visible-assets" aria-pressed="${state.streetPanel === "assets"}">Visible Assets</button>
            <button type="button" class="md-secondary" data-street-panel="tasks" aria-controls="md-inspection-tasks" aria-pressed="${state.streetPanel === "tasks"}">Inspection Tasks</button>
            ${summaryButton()}
          </div>
          <div id="md-visible-assets" class="md-utility-links" role="group" aria-label="Visible Assets" ${state.streetPanel === "assets" ? "" : "hidden"}>
            ${utilityLinks || '<p class="md-empty-assets">Advance to the next viewpoint to inspect more assets.</p>'}
          </div>
          <div id="md-inspection-tasks" class="md-street-activities" role="group" aria-label="Inspection Tasks" ${state.streetPanel === "tasks" ? "" : "hidden"}>${activities}</div>
        </div>
      </div>`;
  }

  function openUtility(id) {
    const asset = utilities[id];
    utilityDialog.innerHTML = `<div class="md-utility-top">
      <span class="md-utility-badge" style="--utility-color:${asset.color}">${escapeHtml(asset.service)}</span>
      <button type="button" class="md-utility-close" data-close-utility aria-label="Close Asset Card" autofocus>×</button>
      </div><h2 id="md-utility-title">${escapeHtml(asset.title)}</h2>
      <dl><dt>Visual Observation</dt><dd>${escapeHtml(asset.visible)}</dd>
      <dt>Evidence to Verify</dt><dd>${escapeHtml(asset.evidence)}</dd></dl>
      ${asset.exercise === undefined ? "" : `<button type="button" class="md-primary" data-open="${asset.exercise}">Go to Question</button>`}`;
    utilityDialog.showModal();
  }

  function setLook(x, y) {
    const camera = root.querySelector(".md-street-camera");
    if (!camera) return;
    if (panorama) {
      state.lookX = x;
      state.lookY = Math.max(-230, Math.min(230, y));
      panorama.update(state.lookX, state.lookY, state.zoom);
      return;
    }
    const world = camera.querySelector(".md-street-world");
    const scale = Math.max(1, state.zoom);
    const limitX = Math.max(0, (world.clientWidth * scale - camera.clientWidth) / 2);
    const limitY = Math.max(0, (world.clientHeight * scale - camera.clientHeight) / 2);
    world.style.setProperty("--look-scale", scale);
    state.lookX = Math.max(-limitX, Math.min(limitX, x));
    state.lookY = Math.max(-limitY, Math.min(limitY, y));
    world.style.setProperty("--look-x", `${state.lookX}px`);
    world.style.setProperty("--look-y", `${state.lookY}px`);
  }

  function updateZoomControls(camera) {
    const minimum = panorama ? minZoom : 1;
    camera.querySelector(".md-zoom output").textContent = `${Math.round(state.zoom * 100)}%`;
    camera.querySelector('[data-zoom-step="-1"]').disabled = state.zoom <= minimum;
    camera.querySelector('[data-zoom-step="1"]').disabled = state.zoom >= maxZoom;
  }

  function setZoom(magnification, x = state.lookX, y = state.lookY) {
    const camera = root.querySelector(".md-street-camera");
    const minimum = panorama ? minZoom : 1;
    state.zoom = Math.max(minimum, Math.min(maxZoom, magnification));
    updateZoomControls(camera);
    setLook(x, y);
  }

  function resetView() {
    const { initialLookX = 0, initialLookY = 0 } = viewpoints[state.viewpoint];
    setZoom(1, initialLookX, initialLookY);
  }

  function moveStreet(direction) {
    const next = state.viewpoint + direction;
    if (next < 0 || next >= viewpoints.length) return;
    state.viewpoint = next;
    state.zoom = 1;
    state.lookX = viewpoints[next].initialLookX ?? 0;
    state.lookY = viewpoints[next].initialLookY ?? 0;
    drag = null;
    render(".md-street-camera");
  }

  function descent(stop) {
    return `<h1 tabindex="-1">Close-up · ${escapeHtml(stop.title)}</h1>
      <figure class="md-viewer md-transition md-target-${state.active}">
        <img src="${street}" alt="Street overview before opening the close-up view.">
      </figure>
      <button type="button" class="md-secondary" data-view="stop">Skip Animation</button>`;
  }

  function stopView(stop) {
    const answer = state.answers[stop.id];
    const answered = answer !== undefined;
    const choices = stop.choices.map((choice, index) => `
      <label class="md-choice">
        <input type="radio" name="answer" value="${index}" ${(answered ? answer : state.selected) === index ? "checked" : ""}>
        <span>${escapeHtml(choice)}</span>
      </label>`).join("");
    const feedback = answered ? `
      <div class="md-feedback" tabindex="-1">
        <strong>${answer === stop.correct ? "Correct Answer" : "Review the Required Evidence"}</strong>
        <p>${escapeHtml(stop.feedback)}</p>
      </div>
      <button type="button" class="md-primary" data-next>${Object.keys(state.answers).length === stops.length ? "View Inspection Summary" : "Next Unanswered Stop"}</button>` : "";
    return `<button type="button" class="md-back" data-view="${state.backTo}">${state.backTo === "street" ? "← Back to Street View" : "← Overview"}</button>
      <h1 tabindex="-1">${escapeHtml(stop.id + " · " + stop.title)}</h1>
      <div class="md-grid">
        ${image(stop.photo, stop.alt, "Close-up · Training Simulation")}
        <div class="md-panel">
          <p>${escapeHtml(stop.observation)}</p>
          <form>
            <fieldset ${answered ? "disabled" : ""}>
              <legend>${escapeHtml(stop.question)}</legend>
              ${choices}
            </fieldset>
            ${answered ? "" : '<button type="submit" class="md-primary" disabled>Check Answer</button>'}
          </form>
          ${feedback}
        </div>
      </div>`;
  }

  function summary() {
    const score = stops.filter(stop => state.answers[stop.id] === stop.correct).length;
    const results = stops.map(stop => `<li><strong>${escapeHtml(stop.id + " · " + stop.title)}</strong>
      <dl><dt>Observed in the field</dt><dd>${escapeHtml(stop.observation)}</dd>
        <dt>Requires verification</dt><dd>${escapeHtml(stop.verification)}</dd>
        <dt>Next action</dt><dd>${escapeHtml(stop.action)}</dd></dl></li>`).join("");
    return `<h1 tabindex="-1">Inspection Findings</h1>
      <p>Correct answers: ${score} of ${stops.length}.</p>
      <ul class="md-results">${results}</ul>
      <div class="md-actions">
        <button type="button" class="md-secondary" data-view="overview">Back to Overview</button>
        <button type="button" class="md-primary" data-restart>Restart Route</button>
      </div>`;
  }

  function mountPanorama() {
    const camera = root.querySelector(".md-street-camera");
    const layer = camera.querySelector(".md-pano-layer");
    const world = camera.querySelector(".md-street-world");
    const caption = camera.querySelector(".md-street-caption");
    const onReady = ready => {
      layer.hidden = !ready;
      world.hidden = ready;
      caption.textContent = ready ? "360° Panorama · Training Simulation" : "Fallback View · Training Simulation";
      if (!ready) {
        panorama?.dispose();
        panorama = null;
        setZoom(state.zoom, 0, 0);
      }
    };
    try {
      panorama = window.createStreetPanorama?.(layer.querySelector("canvas"),
        Array.from(layer.querySelectorAll("[data-photo-x]")),
        `./panoramas/${panoramas[state.viewpoint]}.webp`, onReady);
    } catch (error) {
      console.warn("Panoramic viewer unavailable", error);
    }
    if (!panorama) onReady(false);
  }

  function render(focusSelector) {
    panorama?.dispose();
    panorama = null;
    const stop = stops[state.active];
    const views = { overview, street: streetView, descent, stop: stopView, summary };
    const content = root.querySelector(".md-content");
    root.dataset.view = content.dataset.view = state.view;
    content.innerHTML = views[state.view](stop);
    root.querySelector(".md-progress").textContent = `${Object.keys(state.answers).length} of ${stops.length} stops answered`;
    if (state.view === "street") {
      mountPanorama();
      updateZoomControls(root.querySelector(".md-street-camera"));
      setLook(state.lookX, state.lookY);
    }
    if (focusSelector) root.querySelector(focusSelector)?.focus({ preventScroll: state.view === "street" });
  }

  function navigate(view) {
    clearTimeout(transitionTimer);
    drag = null;
    state.view = view;
    render("h1");
    if (view === "street" || view === "overview") window.scrollTo(0, 0);
  }

  function openStop(index) {
    if (state.view === "street" || state.view === "overview") state.backTo = state.view;
    state.active = index;
    state.selected = null;
    if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
      navigate("stop");
      return;
    }
    navigate("descent");
    transitionTimer = setTimeout(() => navigate("stop"), 850);
  }

  root.querySelector(".md-header img").src = brand;
  root.addEventListener("click", event => {
    const button = event.target.closest("button");
    if (!button || button.disabled) return;
    if ("open" in button.dataset) {
      if (utilityDialog.open) utilityDialog.close();
      openStop(Number(button.dataset.open));
    } else if ("utility" in button.dataset) {
      openUtility(button.dataset.utility);
    } else if ("closeUtility" in button.dataset) {
      utilityDialog.close();
    } else if ("view" in button.dataset) {
      navigate(button.dataset.view);
    } else if ("move" in button.dataset) {
      moveStreet(Number(button.dataset.move));
    } else if ("streetPanel" in button.dataset) {
      state.streetPanel = button.dataset.streetPanel;
      root.querySelectorAll("[data-street-panel]").forEach(option =>
        option.setAttribute("aria-pressed", String(option === button)));
      root.querySelector("#md-visible-assets").hidden = state.streetPanel !== "assets";
      root.querySelector("#md-inspection-tasks").hidden = state.streetPanel !== "tasks";
      setLook(state.lookX, state.lookY);
    } else if ("zoomStep" in button.dataset) {
      setZoom(state.zoom * (1.15 ** Number(button.dataset.zoomStep)));
    } else if ("center" in button.dataset) {
      resetView();
    } else if ("restart" in button.dataset) {
      state.answers = {};
      state.streetPanel = "assets";
      state.viewpoint = 0;
      state.lookX = 0;
      state.lookY = 0;
      state.zoom = 1;
      state.selected = null;
      navigate("overview");
    } else if ("next" in button.dataset) {
      for (let offset = 1; offset <= stops.length; offset++) {
        const index = (state.active + offset) % stops.length;
        if (!(stops[index].id in state.answers)) {
          openStop(index);
          return;
        }
      }
      navigate("summary");
    }
  });

  for (const [eventType, active] of [["pointerover", true], ["pointerout", false], ["focusin", true], ["focusout", false]]) {
    root.addEventListener(eventType, event => {
      const row = event.target.closest(".md-stop-link");
      if (!row || row.contains(event.relatedTarget)) return;
      const highlighted = active || row.matches(":hover, :focus-visible");
      root.querySelector(`.md-pin[data-open="${row.dataset.open}"]`)?.classList.toggle("is-highlighted", highlighted);
    });
  }

  utilityDialog.addEventListener("click", event => {
    if (event.target !== utilityDialog) return;
    const bounds = utilityDialog.getBoundingClientRect();
    if (event.clientX < bounds.left || event.clientX > bounds.right ||
        event.clientY < bounds.top || event.clientY > bounds.bottom) utilityDialog.close();
  });

  root.addEventListener("pointerdown", event => {
    const camera = event.target.closest(".md-street-camera");
    if (!camera || event.target.closest("button") || event.button !== 0 || !event.isPrimary) return;
    drag = { id: event.pointerId, x: event.clientX - state.lookX, y: event.clientY - state.lookY };
    camera.setPointerCapture(event.pointerId);
  });

  root.addEventListener("pointermove", event => {
    if (drag?.id !== event.pointerId) return;
    setLook(event.clientX - drag.x, event.clientY - drag.y);
  });

  for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
    root.addEventListener(type, event => {
      if (drag?.id === event.pointerId) drag = null;
    });
  }

  root.addEventListener("wheel", event => {
    const camera = event.target.closest(".md-street-camera");
    if (!camera || event.ctrlKey || event.metaKey) return;
    const mode = event.deltaMode;
    if (!event.deltaY) return;
    event.preventDefault();
    const unit = mode === 1 ? 16 : mode === 2 ? camera.clientHeight : 1;
    const delta = Math.max(-160, Math.min(160, event.deltaY * unit));
    setZoom(state.zoom * Math.exp(-delta * .0015));
  }, { passive: false });

  root.addEventListener("keydown", event => {
    if (!event.target.matches(".md-street-camera")) return;
    const key = event.key;
    if (!["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "PageUp", "PageDown", "Home", "+", "=", "-"].includes(key)) return;
    event.preventDefault();
    if (key === "ArrowUp") moveStreet(1);
    if (key === "ArrowDown") moveStreet(-1);
    if (key === "ArrowLeft") setLook(state.lookX + 40, state.lookY);
    if (key === "ArrowRight") setLook(state.lookX - 40, state.lookY);
    if (key === "PageUp") setLook(state.lookX, state.lookY + 40);
    if (key === "PageDown") setLook(state.lookX, state.lookY - 40);
    if (key === "Home") resetView();
    if (key === "+" || key === "=") setZoom(state.zoom * 1.15);
    if (key === "-") setZoom(state.zoom / 1.15);
  });

  window.addEventListener("resize", () => {
    if (state.view === "street") setLook(state.lookX, state.lookY);
  });

  root.addEventListener("change", event => {
    if (event.target.name !== "answer") return;
    state.selected = Number(event.target.value);
    root.querySelector('button[type="submit"]').disabled = false;
  });

  root.addEventListener("submit", event => {
    event.preventDefault();
    const stop = stops[state.active];
    if (state.selected === null || stop.id in state.answers) return;
    state.answers[stop.id] = state.selected;
    render(".md-feedback");
  });

  render();
}
</script>
</body>
</html>
